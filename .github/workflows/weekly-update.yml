name: Weekly update

on:
  schedule:
    # Sunday 23:00 UTC = 7pm ET (EDT) / 6pm ET (EST)
    - cron: "0 23 * * 0"
  push:
    branches: [main]
    paths:
      - "data/raw/optn/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test YoY / week logic
        run: python3 -m unittest discover -s tests

      - name: Fetch SRTA price
        run: python3 scripts/fetch_price.py

      - name: Fetch news
        run: python3 scripts/fetch_news.py

      - name: Install Playwright (headless Chromium for the OPTN Shiny dashboard)
        run: |
          pip install playwright==1.59.0
          python3 -m playwright install --with-deps chromium

      - name: Fetch OPTN weekly transplants
        id: optn
        continue-on-error: true
        run: python3 scripts/fetch_optn.py

      - name: Ingest OPTN files
        run: python3 scripts/ingest_optn.py

      - name: Build weekly digest
        run: python3 scripts/build_digest.py

      - name: Commit results
        run: |
          git config user.name "srta-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/optn data/processed data/weekly_summary.json summary/latest.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly update ($(date -u +%Y-%m-%d))"
            # generated files: if another run pushed first, keep this (newer) run's output
            git pull --rebase -X theirs
            git push
          fi

      - name: Flag OPTN fetch failure
        if: steps.optn.outcome == 'failure'
        run: |
          echo "::error::OPTN fetch failed; page kept the previous OPTN data. See 'Fetch OPTN weekly transplants' log."
          exit 1
