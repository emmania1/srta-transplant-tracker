name: Weekly update

on:
  schedule:
    # Sunday 23:00 UTC = 7pm ET (EDT) / 6pm ET (EST)
    - cron: "0 23 * * 0"
  push:
    branches: [main]
    paths:
      - "data/raw/optn/**"
      - "data/manual/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test YoY / week logic
        run: python3 -m unittest discover -s tests

      # Every fetch is allowed to fail: the page keeps the last good data and
      # scripts/health.py turns failures into a banner + a "Data issue:" digest line.
      - name: Fetch prices (SRTA, TMDX, JOBY)
        id: price
        continue-on-error: true
        run: python3 scripts/fetch_price.py

      - name: Fetch news
        id: news
        continue-on-error: true
        run: python3 scripts/fetch_news.py

      - name: Install Playwright (headless Chromium for the OPTN Shiny dashboard)
        run: |
          pip install playwright==1.59.0
          python3 -m playwright install --with-deps chromium

      - name: Fetch OPTN weekly (transplants, donors, waitlist, regions)
        id: optn
        continue-on-error: true
        run: python3 scripts/fetch_optn.py

      - name: Fetch OPTN national data (saves a snapshot only when OPTN's monthly refresh lands)
        id: optn_national
        continue-on-error: true
        run: python3 scripts/fetch_optn_national.py

      - name: Fetch CDC overdose deaths
        id: cdc
        continue-on-error: true
        run: python3 scripts/fetch_cdc.py

      - name: Ingest OPTN files
        run: python3 scripts/ingest_optn.py

      - name: Health check
        env:
          STEP_OUTCOMES: >-
            {"Prices": "${{ steps.price.outcome }}", "News": "${{ steps.news.outcome }}",
             "OPTN weekly": "${{ steps.optn.outcome }}", "OPTN national": "${{ steps.optn_national.outcome }}",
             "CDC": "${{ steps.cdc.outcome }}"}
        run: python3 scripts/health.py

      - name: Build weekly digest
        run: python3 scripts/build_digest.py

      - name: Commit results
        run: |
          git config user.name "srta-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/optn data/processed data/weekly_summary.json summary/latest.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly update ($(date -u +%Y-%m-%d))"
            # generated files: if another run pushed first, keep this (newer) run's output
            git pull --rebase -X theirs
            git push
          fi

      - name: Mark the run red if any fetch failed (data was still committed)
        if: >-
          steps.price.outcome == 'failure' || steps.news.outcome == 'failure' || steps.optn.outcome == 'failure' ||
          steps.optn_national.outcome == 'failure' || steps.cdc.outcome == 'failure'
        run: |
          echo "::error::A fetch failed; see data/processed/health.json. The page kept the previous data."
          exit 1
